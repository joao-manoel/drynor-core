# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Fetch pinned gameval catalogs
      run: |
        mkdir -p ../cache-unpacked
        curl --fail --location 'https://gitlab.com/api/v4/projects/86047720/repository/archive.tar.gz?sha=faf21332c82ec2540897cebc8041f6fedaced162&path=gamevals' -o "$RUNNER_TEMP/gamevals.tar.gz"
        tar -xzf "$RUNNER_TEMP/gamevals.tar.gz" --strip-components=1 -C ../cache-unpacked
    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: gradle
    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew build --no-daemon
