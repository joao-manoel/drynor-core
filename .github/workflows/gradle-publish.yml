# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a package using Gradle and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-gradle

name: Publish Maven package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Fetch pinned gameval catalogs
      run: |
        mkdir -p ../cache-unpacked
        curl --fail --location 'https://gitlab.com/api/v4/projects/86047720/repository/archive.tar.gz?sha=faf21332c82ec2540897cebc8041f6fedaced162&path=gamevals' -o "$RUNNER_TEMP/gamevals.tar.gz"
        tar -xzf "$RUNNER_TEMP/gamevals.tar.gz" --strip-components=1 -C ../cache-unpacked
    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: gradle

    - name: Publish to GitHub Packages
      run: |
        chmod +x gradlew
        ./gradlew clean build publish --no-daemon
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
